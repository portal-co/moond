<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Binary Control Panel</title>
    <style>
        body { background: #e0e4e7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; }
        .panel { background: white; padding: 40px; border-radius: 2px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 10px solid #2c3e50; position: relative; }
        
        .row { display: flex; align-items: center; margin-bottom: 12px; }
        .row-label { width: 80px; font-size: 10px; color: #777; font-weight: bold; text-transform: uppercase; }
        
        .bits { display: flex; gap: 8px; }
        .bit { width: 14px; height: 14px; background: #111; border-radius: 50%; cursor: pointer; transition: all 0.2s; border: 2px solid #ddd; }
        .bit.active { background: #ff3b3b; box-shadow: 0 0 10px #ff3b3b; border-color: #ff9999; }
        .bit:hover { transform: scale(1.2); }

        .footer { margin-top: 30px; border-top: 1px solid #eee; padding-top: 10px; display: flex; justify-content: center; gap: 20px; }
        .control { width: 10px; height: 10px; border-radius: 50%; background: #999; }
        .control.red { background: #cc0000; }
        
        .connection-status { position: fixed; top: 10px; right: 10px; padding: 5px 10px; border-radius: 3px; font-size: 11px; }
        .connection-status.connected { background: #2fff2f; color: #000; }
        .connection-status.disconnected { background: #ff3b3b; color: #fff; }
    </style>
</head>
<body>

<div class="connection-status disconnected" id="connStatus">Disconnected</div>

<div class="panel">
    <div id="grid"></div>
    
    <div class="footer">
        <div class="control"></div>
        <div class="control red"></div>
        <div class="control"></div>
    </div>
</div>

<script type="module">
    import { agcClient } from './agc-client.js';

    const grid = document.getElementById('grid');
    const connStatus = document.getElementById('connStatus');
    const rowLabels = ['Address', 'Data HI', 'Data LO', 'Instruction', 'Status', 'Buffer'];
    const bitElements = {};

    rowLabels.forEach(label => {
        const row = document.createElement('div');
        row.className = 'row';
        
        const labelDiv = document.createElement('div');
        labelDiv.className = 'row-label';
        labelDiv.innerText = label;
        
        const bitsDiv = document.createElement('div');
        bitsDiv.className = 'bits';
        bitElements[label] = [];
        
        for (let i = 0; i < 16; i++) {
            const bit = document.createElement('div');
            bit.className = 'bit';
            bit.dataset.row = label;
            bit.dataset.bit = i;
            bit.onclick = () => {
                agcClient.sendBitToggle(label, i);
                bit.classList.toggle('active');
            };
            bitsDiv.appendChild(bit);
            bitElements[label].push(bit);
        }
        
        row.appendChild(labelDiv);
        row.appendChild(bitsDiv);
        grid.appendChild(row);
    });

    function updateUI(state) {
        if (!state.bits) return;
        
        for (const [label, bits] of Object.entries(state.bits)) {
            if (bitElements[label]) {
                bits.forEach((val, i) => {
                    if (bitElements[label][i]) {
                        bitElements[label][i].classList.toggle('active', !!val);
                    }
                });
            }
        }
    }

    agcClient.addEventListener('connected', () => {
        connStatus.className = 'connection-status connected';
        connStatus.innerText = 'Connected';
    });

    agcClient.addEventListener('disconnected', () => {
        connStatus.className = 'connection-status disconnected';
        connStatus.innerText = 'Disconnected';
    });

    agcClient.addEventListener('snapshot', (e) => updateUI(e.detail));
    agcClient.addEventListener('patch', () => updateUI(agcClient.state));

    agcClient.connect().catch(() => {
        console.log('WebSocket not available, running in offline mode');
    });
</script>

</body>
</html>
