<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AGC DSKY Simulation</title>
    <style>
        body { background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .dsky { background: #4a4d4e; width: 320px; padding: 20px; border-radius: 5px; border: 4px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Display Area */
        .top-section { display: flex; gap: 10px; margin-bottom: 20px; height: 180px; }
        .status-panel { flex: 1; background: #3c3f41; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 5px; font-size: 8px; color: #aaa; text-align: center; }
        .status-panel div { border: 1px solid #555; display: flex; align-items: center; justify-content: center; height: 20px; transition: all 0.2s; }
        .status-panel div.active { background: #ff3b3b; color: white; }
        
        .numeric-display { flex: 1; background: #121212; border: 2px solid #222; padding: 10px; color: #2fff2f; font-family: 'Courier New', Courier, monospace; font-weight: bold; text-shadow: 0 0 5px #008000; }
        .reg-label { font-size: 10px; color: #888; margin-top: 5px; }
        .val { font-size: 22px; text-align: right; display: block; letter-spacing: 2px; }

        /* Keypad Area */
        .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        button { background: #2a2c2d; color: white; border: 1px solid #111; padding: 15px 5px; font-size: 12px; cursor: pointer; border-radius: 2px; box-shadow: inset 0 1px 1px #555; }
        button:active { background: #1a1a1a; box-shadow: inset 0 2px 5px #000; }
        .btn-dark { background: #111; }
        
        .connection-status { position: fixed; top: 10px; right: 10px; padding: 5px 10px; border-radius: 3px; font-size: 11px; }
        .connection-status.connected { background: #2fff2f; color: #000; }
        .connection-status.disconnected { background: #ff3b3b; color: #fff; }
    </style>
</head>
<body>

<div class="connection-status disconnected" id="connStatus">Disconnected</div>

<div class="dsky">
    <div class="top-section">
        <div class="status-panel" id="statusPanel">
            <div data-status="UPLINK">UPLINK</div><div data-status="TEMP">TEMP</div>
            <div data-status="NO ATT">NO ATT</div><div data-status="GIMBAL">GIMBAL</div>
            <div data-status="STBY">STBY</div><div data-status="PROG">PROG</div>
            <div data-status="KEY REL">KEY REL</div><div data-status="RESTART">RESTART</div>
            <div data-status="OPR ERR">OPR ERR</div><div data-status="TRACKER">TRACKER</div>
        </div>
        <div class="numeric-display">
            <div style="display: flex; justify-content: space-between;">
                <div><span class="reg-label">PROG</span><br><span id="prog" class="val">66</span></div>
            </div>
            <div><span class="reg-label">VERB</span><br><span id="verb" class="val">06</span></div>
            <div><span class="reg-label">NOUN</span><br><span id="noun" class="val">60</span></div>
            <div style="border-top: 1px solid #333; margin-top: 5px; padding-top: 5px;">
                <span id="r1" class="val">+00000</span>
                <span id="r2" class="val">+00000</span>
                <span id="r3" class="val">+00000</span>
            </div>
        </div>
    </div>

    <div class="keypad">
        <button class="btn-dark" data-key="VERB">VERB</button>
        <button data-key="+">+</button>
        <button data-key="7">7</button>
        <button data-key="8">8</button>
        <button data-key="9">9</button>

        <button class="btn-dark" data-key="NOUN">NOUN</button>
        <button data-key="-">-</button>
        <button data-key="4">4</button>
        <button data-key="5">5</button>
        <button data-key="6">6</button>

        <button class="btn-dark" data-key="CLR">CLR</button>
        <button data-key="0">0</button>
        <button data-key="1">1</button>
        <button data-key="2">2</button>
        <button data-key="3">3</button>

        <button class="btn-dark" data-key="PRO">PRO</button>
        <button class="btn-dark" data-key="ENTR">ENTR</button>
        <button class="btn-dark" data-key="RSET">RSET</button>
        <button class="btn-dark" data-key="KEY REL">KEY REL</button>
        <button class="btn-dark" data-key="CLR">CLR</button>
    </div>
</div>

<script type="module">
    import { agcClient, getPath } from './agc-client.js';

    const registers = ['prog', 'verb', 'noun', 'r1', 'r2', 'r3'];
    const statusPanel = document.getElementById('statusPanel');
    const connStatus = document.getElementById('connStatus');

    function updateUI(state) {
        if (!state.registers) return;
        
        for (const reg of registers) {
            const el = document.getElementById(reg);
            if (el && state.registers[reg] !== undefined) {
                el.innerText = state.registers[reg];
            }
        }
        
        if (state.status) {
            statusPanel.querySelectorAll('[data-status]').forEach(el => {
                const key = el.dataset.status;
                el.classList.toggle('active', !!state.status[key]);
            });
        }
    }

    agcClient.addEventListener('connected', () => {
        connStatus.className = 'connection-status connected';
        connStatus.innerText = 'Connected';
    });

    agcClient.addEventListener('disconnected', () => {
        connStatus.className = 'connection-status disconnected';
        connStatus.innerText = 'Disconnected';
    });

    agcClient.addEventListener('snapshot', (e) => updateUI(e.detail));
    agcClient.addEventListener('patch', () => updateUI(agcClient.state));

    document.querySelector('.keypad').addEventListener('click', (e) => {
        const key = e.target.dataset.key;
        if (key) {
            agcClient.sendKeypress(key);
        }
    });

    agcClient.connect().catch(() => {
        console.log('WebSocket not available, running in offline mode');
    });
</script>

</body>
</html>
