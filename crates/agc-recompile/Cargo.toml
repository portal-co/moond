[package]
name = "agc-recompile"
version = "0.1.0"
edition = "2021"
description = "AGC Block-2 → C/WASM recompiler (via TC2 bytecode frontend)"

[dependencies]
agc-isa    = { path = "../agc-isa" }
agc-interp = { path = "../agc-interp" }
agc-lower  = { path = "../agc-lower" }
yecta        = { git = "https://github.com/portal-co/speet.git", rev = "d46ca7df9428ed1fe9571632d8a6900938f700a6" }
speet-traps  = { git = "https://github.com/portal-co/speet.git", rev = "d46ca7df9428ed1fe9571632d8a6900938f700a6" }
wasm-encoder = { version = "0.240.0", default-features = false, features = ["wasmparser"] }

[dev-dependencies]
agc-asm      = { path = "../agc-asm" }
wasmparser   = { version = "0.240.0", default-features = false, features = ["validate", "features"] }
